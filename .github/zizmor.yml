# zizmor configuration — the CI supply-chain auditor run by quality.yml.
#
# Everything zizmor reports is on by default. This file records the places where
# the default disagrees with a deliberate decision in this repo, and why. A
# finding that is simply inconvenient does not belong here — it belongs fixed.
#
# Docs: https://docs.zizmor.sh/configuration/
rules:

  # zizmor's blanket policy wants every `uses:` pinned to a commit hash. This
  # repo pins to release TAGS instead, and that is a considered trade, not
  # laziness:
  #
  # - Dependabot keeps tags current on a weekly cadence (.github/dependabot.yml),
  #   and its PRs are readable — `v7.0.0 → v7.0.1` says what changed. A hash bump
  #   says nothing, so it gets rubber-stamped, which is the failure hash-pinning
  #   was supposed to prevent.
  # - Every action used here is from a publisher whose tags are protected:
  #   actions/, github/, google-github-actions/, plus the org account that owns
  #   the release path. The tag-mutation attack hash-pinning defends against
  #   needs the publisher's own account.
  #
  # `ref-pin` requires *a* ref and accepts a branch as one, so it fails only a
  # `uses:` with no ref at all. It does not forbid `@main`.
  unpinned-uses:
    config:
      policies:
        # duplocloud/version-bump stays on @main on purpose: its main is ahead
        # of its latest tag, so a tag pin would run older release code than the
        # sibling repos do. Named here so that choice is visible, not implied.
        duplocloud/*: ref-pin
        "*": ref-pin

  # `uses: ./.github/workflows/test.yml` is already the local-path form. zizmor
  # reads the call as a same-repository reference it would rather see written
  # another way; there is no other way to write it that keeps a called workflow
  # in this repo, so the advice has nothing to act on here.
  self-repository:
    ignore:
    - publish.yml

  # The checkout in publish.yml MUST keep its credentials: duplocloud/version-bump
  # commits the rolled changelog and pushes the tag through the remote checkout
  # configured — the only thing the job exists for. The one artifact that job
  # uploads is `notes/release-notes.md`, written outside the checkout, so the
  # credential in `.git/config` is not in anything that leaves the runner.
  artipacked:
    ignore:
    - publish.yml

  # `gh release create` in a script step would work, but softprops/action-gh-release
  # is the house standard across every kubed-io repo's publish.yml. Consistency
  # across the sibling repos is worth more here than dropping one dependency.
  superfluous-actions:
    ignore:
    - publish.yml
