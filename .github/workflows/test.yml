name: 🧪 Test

# Unit tests on Node's built-in runner: applyTheme against a fake element and
# theme, and a scan of theme.css for anything that escapes the .kd scope or
# hard-codes a colour. No npm dependencies, so there is nothing to install and
# nothing for a cache to hold.
#
# One Node version, not a matrix. The code runs in Grafana users' browsers,
# never in Node; Node is only the test harness, and 24 is the current LTS.
#
# publish.yml calls this through workflow_call before it cuts a version, so a
# release never tags a tree whose tests are red.

on:
  # No `paths` filter on pull_request, deliberately. A path-filtered required
  # check never reports on a PR that misses the filter — GitHub then waits for
  # it forever and the PR can never merge. The push filter below is fine:
  # nothing gates on it.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
    - grafana/**
    - test/**
    - .github/workflows/test.yml
  workflow_dispatch:
  workflow_call: {}

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Test
      run: node --test
