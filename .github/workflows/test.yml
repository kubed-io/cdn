name: 🧪 Test

# The type check and Vitest under happy-dom: the theme layer, guarded element
# definitions, and a scan of every stylesheet for anything that escapes the .kd
# scope or hard-codes a colour. The build and its size report are package.yml's.
#
# One Node version, not a matrix. The code runs in Grafana users' browsers,
# never in Node; Node is only the toolchain, and 24 is the current LTS.
#
# publish.yml calls this through workflow_call before it cuts a version, so a
# release never tags a tree whose tests are red.

on:
  # No `paths` filter on pull_request, deliberately. A path-filtered required
  # check never reports on a PR that misses the filter — GitHub then waits for
  # it forever and the PR can never merge. The push filter below is fine:
  # nothing gates on it.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
    - src/**
    - test/**
    - package.json
    - package-lock.json
    - tsconfig*.json
    - vite.config.ts
    - .github/workflows/test.yml
  workflow_dispatch:
  workflow_call: {}

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    # --ignore-scripts: no dependency gets to run code at install time. The
    # toolchain needs none (Vite 8's bundler ships as prebuilt optional packages).
    - name: Install
      run: npm ci --ignore-scripts

    - name: Type Check
      run: npm run typecheck

    - name: Test
      run: npm test
