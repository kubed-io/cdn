# k8s-rd's schema panel with <kd-schema> instead of 22 KB of jq-built HTML.
# A v2 Panel element. The dashboard needs the hidden `assets` constant
# (https://cdn.jsdelivr.net/npm/@kubed.io/cdn@X.Y.Z/dist) and its `rd` variable
# (`apis/apps/v1#Deployment`, `api/v1#Pod`, ...).
kind: Panel
spec:
  title: ''
  transparent: true
  data:
    kind: QueryGroup
    spec:
      queries:
      - kind: PanelQuery
        spec:
          refId: A
          query:
            kind: DataQuery
            group: yesoreyeram-infinity-datasource
            datasource:
              name: b6273e2d-94eb-457c-ae1e-0a2b06b1befd
            spec:
              type: json
              source: url
              parser: jq-backend
              format: table
              url: https://kubernetes.default.svc/openapi/v3/${rd}
              url_options:
                method: GET
                headers:
                - key: Accept
                  value: application/json
              # The whole document as one string row; the element does the rest.
              root_selector: '[{doc: tojson}]'
              columns:
              - selector: doc
                text: doc
                type: string
  vizConfig:
    kind: marcusolsson-dynamictext-panel
    spec:
      options:
        renderMode: allRows
        content: <div class="kd"><kd-schema omit="apiVersion kind metadata"></kd-schema></div>
        defaultContent: <div class="kd">No schema.</div>
        afterRender: |-
          const base = context.grafana.replaceVariables('${assets}');
          const rd = context.grafana.replaceVariables('${rd}');
          const [path, kind] = rd.split('#');
          const [prefix, ...gv] = path.split('/');
          // apis/apps/v1 -> apps.v1.Deployment; api/v1 -> core.v1.Pod
          const root = (prefix === 'api' ? ['core', ...gv] : gv).join('.') + '.' + kind;
          import(base + '/openapi.js').then((m) => {
            m.applyTheme(context.element, context.grafana.theme);
            const el = context.element.querySelector('kd-schema');
            el.root = root;
            // afterRender runs twice per refresh; parse a ~1 MB document once.
            const doc = context.data[0].doc;
            if (el.dataset.doc !== String(doc.length) || !el.document) {
              el.document = JSON.parse(doc);
              el.dataset.doc = String(doc.length);
            }
          });
        styles: '.dt-row { height: 100%; padding: 4px 0 0; }'
